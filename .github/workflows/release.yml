name: Release APK

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError"

# The tagged build publishes a GitHub Release with the APK attached; creating
# a release requires write access to repository contents (the default token
# is read-only on new repositories).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "${{ env.JAVA_VERSION }}"
          distribution: "temurin"
          cache: "gradle"

      # The repository does not commit the Gradle wrapper scripts; bootstrap them
      # from the committed gradle-wrapper.properties so the build can run even when
      # gradlew/gradle-wrapper.jar are absent from the checkout.
      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Bootstrapping Gradle wrapper from gradle-wrapper.properties"
            mkdir -p gradle/wrapper
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew -o gradlew
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradlew.bat -o gradlew.bat
            curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
            chmod +x gradlew gradlew.bat
          else
            echo "Gradle wrapper already present; ensuring execute bits"
            chmod +x gradlew gradlew.bat
          fi

      # If GitHub Actions doesn't already provide SDK licenses on the runner,
      # accept them so AGP-based builds don't stall. Only needed on fresh VMs.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Restore Gradle dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: github-run-${{ github.run_id }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            github-run-

      # Signing: with the keystore secrets configured the release uses the
      # project key. Without them, generate an ephemeral self-signed JKS
      # keystore on the runner so the APK is ALWAYS signed — Android rejects
      # unsigned APKs ("paquete no válido" / "app not installed").
      - name: Configure release signing
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "No keystore secrets configured — generating an ephemeral CI keystore"
            echo "(self-signed: installable on any device, not suitable for Play Store)."
            keytool -genkeypair -storetype JKS \
              -keystore keystore.jks \
              -alias wifiscanner-ci \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass wifiscanner-ci \
              -keypass wifiscanner-ci \
              -dname "CN=Wi-Fi LAN Scanner CI, OU=CI, O=CI, C=US"
            {
              echo "storeFile=../keystore.jks"
              echo "storePassword=wifiscanner-ci"
              echo "keyAlias=wifiscanner-ci"
              echo "keyPassword=wifiscanner-ci"
            } > app/release.properties
            echo "Ephemeral CI keystore ready."
          else
            echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > keystore.jks
            {
              echo "storeFile=../keystore.jks"
              echo "storePassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD"
              echo "keyAlias=$ANDROID_RELEASE_KEY_ALIAS"
              echo "keyPassword=$ANDROID_RELEASE_KEY_PASSWORD"
            } > app/release.properties
            echo "Release signing configured from repository secrets."
          fi

      - name: Build release APK
        id: build
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate the built APK
        id: apk
        run: |
          apks=$(find app/build/outputs/apk/release -name '*.apk' -print | sort)
          if [ -z "$apks" ]; then
            echo "::error::Expected app/build/outputs/apk/release/*.apk but found none"
            find app/build/outputs -name '*.apk' -print >&2 || true
            exit 1
          fi
          APK=$(echo "$apks" | head -n 1)
          # Safety net: an unsigned artifact can never ship, because Android
          # rejects it on install ("paquete no válido" / "app not installed").
          case "$APK" in
            *unsigned*)
              echo "::error::Built APK is unsigned ($APK); installation would fail on Android"
              exit 1
              ;;
          esac
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -Lc %s "$APK")" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK")" >> "$GITHUB_OUTPUT"

      - name: Show APK metadata and signing state
        run: |
          APK="${{ steps.apk.outputs.apk_path }}"
          echo "APK=${APK} size=${{ steps.apk.outputs.apk_size }}B name=${{ steps.apk.outputs.apk_name }}"
          unzip -l "$APK" | tail -n 1
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" || true
          fi

      - name: Install instructions (job summary)
        run: |
          {
            echo "## Install the APK"
            echo ""
            echo "- **Actions → Artifacts** download is a **.zip**: unzip it first and copy the \`.apk\` inside to the phone — installing the zip itself fails with \"paquete no válido / app not installed\"."
            echo "- **Tagged builds (\`v*\`)** attach the raw \`.apk\` to the GitHub **Release** page — download that file directly."
            echo "- On the phone enable *Install unknown apps* for your file manager, or run \`adb install -r <apk>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wifiscanner-release-apk-${{ github.ref_type == 'tag' && github.ref_name || 'HEAD' }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 25

      - name: Publish to GitHub Release (tagged builds only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          files: ${{ steps.apk.outputs.apk_path }}
      - name: Write checksums artifact
        if: always()
        run: |
          APK="${{ steps.apk.outputs.apk_path }}"
          printf "APK=%s\nSHA256=%s\nMD5=%s\n" \
            "${{ steps.apk.outputs.apk_name }}" \
            "$(sha256sum "$APK" | cut -d' ' -f1)" \
            "$(md5sum "$APK" | cut -d' ' -f1)" > checksums.txt

      - name: Upload checksums artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifiscanner-checksums
          path: checksums.txt
          retention-days: 25
